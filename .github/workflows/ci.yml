name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Žádný job tu nic nezapisuje. Bez tohohle bloku platí výchozí nastavení
# repozitáře — dá se změnit a fork ho mít nemusí.
permissions:
  contents: read

# Akce jsou připnuté na plné SHA commitu: značku `v4` smí majitel cizího
# repozitáře kdykoli přesunout jinam, SHA ne. Komentář za ním říká, které
# vydání to je. Při povýšení změň SHA ve VŠECH workflow naráz — migrate.yml smí
# používat jen ta, která tenhle workflow ověří nad pull requestem
# (hlídá apps/web/test/workflow-pins.test.ts).
jobs:
  # DCO — příspěvky musí být podepsané (git commit -s), viz CONTRIBUTING.md.
  # Běží jen nad PR; commity vlastníka na main se nekontrolují.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Kontrola podpisu commitů
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for sha in $(git rev-list --no-merges "$BASE".."$HEAD"); do
            if ! git log -1 --format='%B' "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "Chybí Signed-off-by: $(git log -1 --format='%h %s' "$sha")"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Podepiš commity přes 'git commit -s' — viz CONTRIBUTING.md."
            exit 1
          fi

  # Lehké strážní kontroly, které nepotřebují build: tajemství v historii,
  # zápis a práva workflow, mrtvé soubory a závislosti. Zvlášť od jobu `ci`,
  # aby běžely souběžně a pád jedné neschoval výsledek testů. Nástroje jedou
  # z obrazů připnutých na digest a repozitář vidí jen ke čtení; žádný krok
  # nepotřebuje tajemství, takže nad pull requestem z forku běží stejně.
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth 0: gitleaks čte celou historii včetně značek, ne jen
      # poslední commit — tajemství smazané o commit později v ní zůstává
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # Falešné poplachy jsou doložené v .gitleaks.toml a .gitleaksignore.
      # Identitu provozovatele tohle NEHLEDÁ (pravidlo 8 v CLAUDE.md) — tu
      # hlídá apps/web/test/email-legal.test.ts.
      - name: Tajemství v historii (gitleaks)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            -v "$PWD:/src:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /src --log-opts="--all" --redact --no-banner \
            --config /src/.gitleaks.toml --gitleaks-ignore-path /src/.gitleaksignore
      - name: Zápis workflow (actionlint)
        run: |
          docker run --rm -v "$PWD":/repo:ro -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color
      # Práva tokenu, nepřipnuté akce, nedůvěryhodné hodnoty vkládané do
      # skriptů. --offline: bez dotazů na GitHub API, výsledek nezávisí na síti.
      - name: Bezpečnost workflow (zizmor)
        run: |
          docker run --rm -v "$PWD":/src:ro -w /src \
            ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101 \
            --offline --no-progress --min-severity medium .github/workflows
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Nepoužité soubory a závislosti, nevyřešené importy (knip.json).
      # Nepoužité exporty zatím nehlídá — viz docs/08-provoz.md.
      - name: Mrtvé soubory a závislosti (knip)
        run: pnpm knip
      # Hlášení v databázi GitHubu k produkčním závislostem. Tři hlášení
      # k Vitestu 3 jsou vědomě ignorovaná v `pnpm.auditConfig` kořenového
      # package.json — proč a dokdy, je v docs/08-provoz.md.
      - name: Známé zranitelnosti v produkčních závislostech (pnpm audit)
        run: pnpm audit --prod

  ci:
    runs-on: ubuntu-latest
    # Produkce jede na Postgresu, testy jinak na PGlite — a PGlite je
    # tolerantnější. Bez téhle služby prošel 6. 8. 2026 do produkce rozbitý
    # import (Date v syrovém sql), viz test/postgres-compat.test.ts.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: danero
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/danero
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Drizzle porovnává jen timestamp nejnovější migrace, nikdy hash: migrace
      # se starším `when` (dva PR vygenerované paralelně) se na produkci tiše
      # přeskočí navždy, i když na čerstvé DB v CI projde. Musí padnout tady.
      - name: Kontrola pořadí migrací
        working-directory: apps/web
        run: node db/check-journal.mjs
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Vygenerovaná XML posíláme na OFICIÁLNÍ testovací podatelnu finanční
      # správy. Tři vady z auditu (odmítnutý rok bez zdanitelných příjmů, český
      # prodej hlášený jako zahraniční zdroj, řídicí znak v jméně) unit testy
      # chytit nemohly — XML bylo „hezké“, jen ho podatelna nepřijala.
      # E-3-14: výpadek cizí služby build shodit nesmí, ODMÍTNUTÍ podatelnou
      # ale ano — landing i FAQ nesou odznak „XML ověřená zkušební podatelnou“,
      # takže tiché odmítnutí by z něj udělalo nepravdivé tvrzení. Skript to
      # rozlišuje návratovým kódem: 2 = nedostupná služba (tolerujeme),
      # 1 = podatelna XML odmítla (padáme). Obojí zapíše do souhrnu běhu.
      - name: Kontrola EPO XML proti testovací podatelně
        run: |
          set +e
          pnpm validate:epo
          kod=$?
          set -e
          if [ "$kod" = "2" ]; then
            echo "::warning::Zkušební podatelna je nedostupná — XML tímhle během ověřené není."
            exit 0
          fi
          exit "$kod"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @danero/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
