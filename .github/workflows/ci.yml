name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # DCO — příspěvky musí být podepsané (git commit -s), viz CONTRIBUTING.md.
  # Běží jen nad PR; commity vlastníka na main se nekontrolují.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Kontrola podpisu commitů
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for sha in $(git rev-list --no-merges "$BASE".."$HEAD"); do
            if ! git log -1 --format='%B' "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "Chybí Signed-off-by: $(git log -1 --format='%h %s' "$sha")"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Podepiš commity přes 'git commit -s' — viz CONTRIBUTING.md."
            exit 1
          fi

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @danero/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
