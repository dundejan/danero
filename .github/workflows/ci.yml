name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # DCO — příspěvky musí být podepsané (git commit -s), viz CONTRIBUTING.md.
  # Běží jen nad PR; commity vlastníka na main se nekontrolují.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Kontrola podpisu commitů
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for sha in $(git rev-list --no-merges "$BASE".."$HEAD"); do
            if ! git log -1 --format='%B' "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "Chybí Signed-off-by: $(git log -1 --format='%h %s' "$sha")"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Podepiš commity přes 'git commit -s' — viz CONTRIBUTING.md."
            exit 1
          fi

  ci:
    runs-on: ubuntu-latest
    # Produkce jede na Postgresu, testy jinak na PGlite — a PGlite je
    # tolerantnější. Bez téhle služby prošel 6. 8. 2026 do produkce rozbitý
    # import (Date v syrovém sql), viz test/postgres-compat.test.ts.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: danero
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/danero
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Drizzle porovnává jen timestamp nejnovější migrace, nikdy hash: migrace
      # se starším `when` (dva PR vygenerované paralelně) se na produkci tiše
      # přeskočí navždy, i když na čerstvé DB v CI projde. Musí padnout tady.
      - name: Kontrola pořadí migrací
        working-directory: apps/web
        run: node db/check-journal.mjs
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Vygenerovaná XML posíláme na OFICIÁLNÍ testovací podatelnu finanční
      # správy. Tři vady z auditu (odmítnutý rok bez zdanitelných příjmů, český
      # prodej hlášený jako zahraniční zdroj, řídicí znak v jméně) unit testy
      # chytit nemohly — XML bylo „hezké“, jen ho podatelna nepřijala.
      # E-3-14: výpadek cizí služby build shodit nesmí, ODMÍTNUTÍ podatelnou
      # ale ano — landing i FAQ nesou odznak „XML ověřená zkušební podatelnou“,
      # takže tiché odmítnutí by z něj udělalo nepravdivé tvrzení. Skript to
      # rozlišuje návratovým kódem: 2 = nedostupná služba (tolerujeme),
      # 1 = podatelna XML odmítla (padáme). Obojí zapíše do souhrnu běhu.
      - name: Kontrola EPO XML proti testovací podatelně
        run: |
          set +e
          pnpm validate:epo
          kod=$?
          set -e
          if [ "$kod" = "2" ]; then
            echo "::warning::Zkušební podatelna je nedostupná — XML tímhle během ověřené není."
            exit 0
          fi
          exit "$kod"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @danero/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # Placené hranice potřebují DANERO_BILLING=stripe, který by zbytku sady
      # zamkl funkce — proto vlastní konfigurace a vlastní krok.
      - run: pnpm --filter @danero/web test:e2e:paywall
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
